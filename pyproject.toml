[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "eod-momentum"
version = "0.1.0"
description = "Leakage-aware end-of-day research; no live orders"
requires-python = ">=3.11"
dependencies = ["numpy", "polars", "pyarrow", "duckdb", "exchange-calendars", "scipy", "pandas", "matplotlib", "pyyaml"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
research = ["statsmodels", "scikit-learn"]
alpaca = ["alpaca-py"]
options = []
dashboard = []
[project.scripts]
eod-momentum = "eod_momentum.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
